:root{
  --bg:#14101c;
  --surface:#1d1829;
  --surface2:#2a2140;
  --ink:#fff7e8;
  --muted:#c9b8d8;
  --line:#ff3b4e;
  --gold:#ffd23f;
  --teal:#39ff9e;
  --orange:#ff6a2b;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e0a16;
    --surface:#1d1829;
    --ink:#fff7e8;
  }
}

*{
  box-sizing:border-box;
}

html,body,#root{
  margin:0;
  background:#0e0a16;
  color:var(--ink);
  height:100%;
  overflow:hidden;
}

body{
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", "Trebuchet MS", sans-serif;
}

button{
  font-family:inherit;
}

.hud-font{
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  letter-spacing:.04em;
}

.body-font{
  font-family:"Trebuchet MS", Verdana, sans-serif;
}

.game-shell{
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:#000;
  padding-top:var(--safe-area-inset-top);
  position:relative;
}

.landscape-stage{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

.control-btn{
  display:grid;
  place-items:center;
  width:52px;
  height:52px;
  border-radius:9999px;
  background:rgba(20,14,35,.55);
  color:#fff;
  border:2px solid rgba(255,255,255,.35);
  backdrop-filter:blur(2px);
  box-shadow:0 4px 0 rgba(0,0,0,.35);
  touch-action:none;
  -moz-user-select:none;
       user-select:none;
  -webkit-user-select:none
}

.control-btn:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 rgba(0,0,0,.35);
  background:rgba(255,210,63,.85);
  color:#111
}

.control-btn.is-active{
  transform:translateY(3px);
  box-shadow:0 1px 0 rgba(0,0,0,.35), 0 0 0 3px rgba(255,210,63,.85);
  background:rgba(255,210,63,.9);
  color:#111
}

.dpad{
  position:relative;
  width:156px;
  height:156px;
  flex:0 0 auto;
  display:grid;
  grid-template-columns:52px 52px 52px;
  grid-template-rows:52px 52px 52px;
  touch-action:none;
  -moz-user-select:none;
       user-select:none;
  -webkit-user-select:none;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))
}

.dpad-btn{
  display:grid;
  place-items:center;
  width:52px;
  height:52px;
  padding:0;
  border:0;
  color:#fff;
  background:rgba(12,8,24,.72);
  backdrop-filter:blur(2px);
  font-size:24px;
  line-height:1;
  cursor:pointer;
  touch-action:none;
  -moz-user-select:none;
       user-select:none;
  -webkit-user-select:none
}

.dpad-btn.is-active,.dpad-btn:active{
  background:rgba(255,210,63,.92);
  color:#111
}

.dpad-up{
  grid-column:2;
  grid-row:1;
  border-radius:14px 14px 0 0;
  border-top:2px solid rgba(255,255,255,.5);
  border-left:2px solid rgba(255,255,255,.5);
  border-right:2px solid rgba(255,255,255,.5)
}

.dpad-left{
  grid-column:1;
  grid-row:2;
  border-radius:14px 0 0 14px;
  border-top:2px solid rgba(255,255,255,.5);
  border-left:2px solid rgba(255,255,255,.5);
  border-bottom:2px solid rgba(255,255,255,.5)
}

.dpad-right{
  grid-column:3;
  grid-row:2;
  border-radius:0 14px 14px 0;
  border-top:2px solid rgba(255,255,255,.5);
  border-right:2px solid rgba(255,255,255,.5);
  border-bottom:2px solid rgba(255,255,255,.5)
}

.dpad-down{
  grid-column:2;
  grid-row:3;
  border-radius:0 0 14px 14px;
  border-left:2px solid rgba(255,255,255,.5);
  border-right:2px solid rgba(255,255,255,.5);
  border-bottom:2px solid rgba(255,255,255,.5)
}

.dpad-center{
  grid-column:2;
  grid-row:2;
  width:52px;
  height:52px;
  border-radius:9999px;
  background:rgba(255,255,255,.92);
  border:2px solid rgba(255,255,255,.65);
  box-shadow:inset 0 0 0 4px rgba(12,8,24,.72);
  z-index:1;
  pointer-events:none
}

.dls-pad{
  position:relative;
  width:212px;
  height:186px;
  flex:0 0 auto;
  touch-action:none;
  -moz-user-select:none;
       user-select:none;
  -webkit-user-select:none
}

.dls-btn{
  position:absolute;
  display:grid;
  place-items:center;
  border-radius:9999px;
  border:2px solid rgba(255,255,255,.45);
  color:#fff;
  background:rgba(20,14,35,.42);
  backdrop-filter:blur(2px);
  box-shadow:0 4px 0 rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.25);
  font-size:28px;
  font-weight:900;
  line-height:1;
  touch-action:none
}

.dls-btn:active,.dls-btn.is-active{
  transform:translateY(3px) scale(.97);
  box-shadow:0 1px 0 rgba(0,0,0,.32), 0 0 0 3px rgba(255,255,255,.65);
  filter:brightness(1.15)
}

.dls-btn-a{
  right:0;
  bottom:0;
  width:78px;
  height:78px;
  font-size:34px;
  background:rgba(0,229,255,.42)
}

.dls-btn-b{
  left:58px;
  bottom:48px;
  width:64px;
  height:64px;
  background:rgba(255,210,63,.42);
  color:#111
}

.dls-btn-c{
  right:32px;
  top:0;
  width:64px;
  height:64px;
  background:rgba(255,106,43,.48)
}

.dls-btn-small{
  width:44px;
  height:44px
}

.dls-btn-dash{
  left:0;
  top:14px;

.dls-btn-heal{

.diff-btn{
  display:flex;
  flex-direction:column;

.diff-btn:active{
  transform:translateY(5px);

.diff-btn-easy{

.diff-btn-medium{
  background:radial-gradient(circle at 35% 30%, #fde047, #ea580c);
  color:#1a1000
}

@media(min-width:640px){
  .diff-btn{
    width:168px;
    height:168px;
    font-size:30px
  }

    height:60px
  }
}

  .landscape-stage{
    position:absolute;
    left:50%;
    top:50%;
    width:100dvh;
    height:100dvw;
    max-width:none;
    transform:translate(-50%,-50%) rotate(90deg);
  }
}

@media (min-width: 640px) {
  .sm\:h-16 {
    height: 4rem;
  }

  .sm\:w-16 {
    width: 4rem;
  }

  .sm\:gap-10 {
    gap: 2.5rem;
  }
}
